<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="javaOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="sysGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="sysGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#sysBg)"/>
  <rect width="800" height="450" fill="url(#sysGrid)"/>

  <!-- Top App Window Header -->
  <rect x="25" y="20" width="750" height="36" rx="8" fill="#131c2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="45" cy="38" r="5" fill="#ef4444"/>
  <circle cx="62" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="38" r="5" fill="#10b981"/>
  <text x="105" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Delta Campus Portal • Student Management System (Java &amp; MySQL)</text>
  <rect x="630" y="28" width="130" height="20" rx="10" fill="rgba(14,165,233,0.15)" stroke="#0ea5e9" stroke-width="1"/>
  <circle cx="642" cy="38" r="3.5" fill="#0ea5e9"/>
  <text x="652" y="42" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">MYSQL CONNECTED</text>

  <!-- Left Table & Management Panel -->
  <rect x="25" y="68" width="460" height="355" rx="10" fill="#0b111e" stroke="rgba(14,165,233,0.2)" stroke-width="1"/>
  
  <!-- Search & Action Toolbar -->
  <rect x="42" y="85" width="240" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="55" y="103" font-family="sans-serif" font-size="10" fill="#94a3b8">🔍 Search by Student ID, Major, Name...</text>
  
  <rect x="290" y="85" width="90" height="28" rx="6" fill="#0284c7"/>
  <text x="335" y="103" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">+ Add Student</text>

  <rect x="388" y="85" width="80" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="428" y="103" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">Export SQL</text>

  <!-- Table Header -->
  <rect x="42" y="125" width="425" height="26" rx="4" fill="#1e293b"/>
  <text x="55" y="142" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">ID</text>
  <text x="110" y="142" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">STUDENT NAME</text>
  <text x="230" y="142" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">MAJOR</text>
  <text x="345" y="142" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">GPA</text>
  <text x="405" y="142" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">STATUS</text>

  <!-- Table Row 1 -->
  <rect x="42" y="157" width="425" height="38" rx="4" fill="rgba(255,255,255,0.02)"/>
  <text x="55" y="180" font-family="monospace" font-size="10" fill="#38bdf8">#24018</text>
  <text x="110" y="180" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff">Asmaa Mohamed</text>
  <text x="230" y="180" font-family="sans-serif" font-size="10" fill="#94a3b8">Artificial Intelligence</text>
  <text x="345" y="180" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981">3.95</text>
  <rect x="398" y="167" width="55" height="20" rx="4" fill="rgba(16,185,129,0.15)"/>
  <text x="425" y="181" font-family="sans-serif" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">ACTIVE</text>

  <!-- Table Row 2 -->
  <rect x="42" y="201" width="425" height="38" rx="4" fill="rgba(255,255,255,0.01)"/>
  <text x="55" y="224" font-family="monospace" font-size="10" fill="#38bdf8">#24019</text>
  <text x="110" y="224" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff">Ahmed Youssef</text>
  <text x="230" y="224" font-family="sans-serif" font-size="10" fill="#94a3b8">Data Engineering</text>
  <text x="345" y="224" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981">3.82</text>
  <rect x="398" y="211" width="55" height="20" rx="4" fill="rgba(16,185,129,0.15)"/>
  <text x="425" y="225" font-family="sans-serif" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">ACTIVE</text>

  <!-- Table Row 3 -->
  <rect x="42" y="245" width="425" height="38" rx="4" fill="rgba(255,255,255,0.02)"/>
  <text x="55" y="268" font-family="monospace" font-size="10" fill="#38bdf8">#24020</text>
  <text x="110" y="268" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff">Salma Mahmoud</text>
  <text x="230" y="268" font-family="sans-serif" font-size="10" fill="#94a3b8">Computer Science</text>
  <text x="345" y="268" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">3.65</text>
  <rect x="398" y="255" width="55" height="20" rx="4" fill="rgba(14,165,233,0.15)"/>
  <text x="425" y="269" font-family="sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">ENROLLED</text>

  <!-- Table Row 4 -->
  <rect x="42" y="289" width="425" height="38" rx="4" fill="rgba(255,255,255,0.01)"/>
  <text x="55" y="312" font-family="monospace" font-size="10" fill="#38bdf8">#24021</text>
  <text x="110" y="312" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff">Omar Khaled</text>
  <text x="230" y="312" font-family="sans-serif" font-size="10" fill="#94a3b8">Cybersecurity</text>
  <text x="345" y="312" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981">3.88</text>
  <rect x="398" y="299" width="55" height="20" rx="4" fill="rgba(16,185,129,0.15)"/>
  <text x="425" y="313" font-family="sans-serif" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">ACTIVE</text>

  <!-- Security & Database Notice -->
  <rect x="42" y="345" width="425" height="58" rx="8" fill="rgba(14,165,233,0.08)" stroke="rgba(14,165,233,0.25)" stroke-width="1"/>
  <text x="55" y="368" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">🔒 Enterprise Security &amp; Database Architecture</text>
  <text x="55" y="387" font-family="sans-serif" font-size="9" fill="#94a3b8">Role-based access control, hashed credentials, ACID transactional safety, optimized SQL indexation.</text>

  <!-- Right Metrics Column -->
  <!-- Card 1: Application Architecture -->
  <rect x="500" y="68" width="275" height="105" rx="10" fill="#0b111e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="518" y="93" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">DATABASE APPLICATION</text>
  <text x="518" y="128" font-family="sans-serif" font-size="22" font-weight="800" fill="#38bdf8">Java &amp; MySQL</text>
  <text x="518" y="148" font-family="sans-serif" font-size="11" fill="#94a3b8">JDBC Connector • OOP Architecture</text>
  <text x="518" y="163" font-family="sans-serif" font-size="10" fill="#64748b">Search &amp; Filter Query Optimization</text>

  <!-- Card 2: Features -->
  <rect x="500" y="188" width="275" height="110" rx="10" fill="#0b111e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="518" y="213" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">CORE CAPABILITIES</text>
  <text x="518" y="244" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">CRUD &amp; Authentication</text>
  <text x="518" y="264" font-family="sans-serif" font-size="11" fill="#38bdf8">• Secure Admin / Faculty Login</text>
  <text x="518" y="282" font-family="sans-serif" font-size="11" fill="#38bdf8">• Dynamic Search &amp; Records Management</text>

  <!-- Card 3: Stack Tags -->
  <rect x="500" y="313" width="275" height="110" rx="10" fill="#0b111e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="518" y="336" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">SOFTWARE STACK</text>
  <g transform="translate(518, 350)">
    <rect x="0" y="0" width="55" height="24" rx="5" fill="#1e293b"/>
    <text x="27" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#f97316" text-anchor="middle">Java</text>
    
    <rect x="63" y="0" width="55" height="24" rx="5" fill="#1e293b"/>
    <text x="90" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#0284c7" text-anchor="middle">SQL</text>
    
    <rect x="126" y="0" width="65" height="24" rx="5" fill="#1e293b"/>
    <text x="158" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">MySQL</text>
    
    <rect x="0" y="30" width="115" height="24" rx="5" fill="#1e293b"/>
    <text x="57" y="46" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">Database Design</text>
    
    <rect x="123" y="30" width="95" height="24" rx="5" fill="#1e293b"/>
    <text x="170" y="46" font-family="sans-serif" font-size="10" font-weight="600" fill="#a855f7" text-anchor="middle">GUI &amp; Security</text>
  </g>
