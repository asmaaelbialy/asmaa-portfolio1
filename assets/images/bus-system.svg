<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Top App Window Header -->
  <rect x="25" y="20" width="750" height="36" rx="8" fill="#131c2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="45" cy="38" r="5" fill="#ef4444"/>
  <circle cx="62" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="38" r="5" fill="#10b981"/>
  <text x="105" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Delta Smart Bus System • AI Route Optimization Dashboard</text>
  <rect x="640" y="28" width="120" height="20" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="652" cy="38" r="3.5" fill="#10b981"/>
  <text x="662" y="42" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981">LIVE ROUTE AI</text>

  <!-- Left Map Panel -->
  <rect x="25" y="68" width="460" height="355" rx="10" fill="#0b111e" stroke="rgba(0,242,254,0.15)" stroke-width="1"/>
  <text x="45" y="98" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Campus Transit Topology &amp; Heatmap</text>
  <text x="45" y="115" font-family="sans-serif" font-size="11" fill="#64748b">Real-time GPS routing &amp; automated path finding</text>

  <!-- Route Map Lines -->
  <!-- Map Roads Background -->
  <path d="M 60 200 Q 150 160 220 230 T 360 210 T 450 280" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 120 340 Q 200 300 260 220 T 420 150" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 80 140 L 260 220 L 400 350" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

  <!-- Optimized AI Route (Glowing Cyan) -->
  <path d="M 60 200 Q 150 160 220 230 T 360 210 T 450 280" fill="none" stroke="#00f2fe" stroke-width="3.5" filter="url(#glow)"/>
  <path d="M 120 340 Q 200 300 260 220 T 420 150" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Station Nodes -->
  <!-- Station 1 -->
  <circle cx="60" cy="200" r="8" fill="#0b111e" stroke="#00f2fe" stroke-width="3"/>
  <text x="50" y="180" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Main Gate</text>

  <!-- Station 2 (AI Hub) -->
  <circle cx="220" cy="230" r="14" fill="rgba(0,242,254,0.2)" stroke="#00f2fe" stroke-width="2"/>
  <circle cx="220" cy="230" r="7" fill="#00f2fe" filter="url(#glow)"/>
  <text x="185" y="260" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">Delta Central Hub</text>

  <!-- Station 3 -->
  <circle cx="360" cy="210" r="8" fill="#0b111e" stroke="#3b82f6" stroke-width="3"/>
  <text x="325" y="195" font-family="sans-serif" font-size="10" font-weight="600" fill="#93c5fd">Faculty of AI</text>

  <!-- Station 4 -->
  <circle cx="450" cy="280" r="8" fill="#0b111e" stroke="#10b981" stroke-width="3"/>
  <text x="400" y="305" font-family="sans-serif" font-size="10" font-weight="600" fill="#6ee7b7">Dormitories</text>

  <!-- Bus Marker -->
  <g transform="translate(145, 172)">
    <rect width="48" height="24" rx="6" fill="#00f2fe" filter="url(#glow)"/>
    <text x="24" y="16" font-family="sans-serif" font-size="10" font-weight="800" fill="#090d16" text-anchor="middle">🚌 Bus 03</text>
  </g>
  <g transform="translate(300, 205)">
    <rect width="48" height="24" rx="6" fill="#3b82f6"/>
    <text x="24" y="16" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">🚌 Bus 01</text>
  </g>

  <!-- Map Tag Alert -->
  <rect x="45" y="365" width="220" height="42" rx="8" fill="rgba(0,242,254,0.08)" stroke="rgba(0,242,254,0.3)" stroke-width="1"/>
  <text x="58" y="383" font-family="sans-serif" font-size="10" font-weight="700" fill="#00f2fe">AI Dynamic Re-Routing</text>
  <text x="58" y="398" font-family="sans-serif" font-size="9" fill="#94a3b8">Congestion bypassed on Sector B (-4.2 min)</text>

  <!-- Right Metrics Column -->
  <!-- Card 1: Route Planning Metric -->
  <rect x="500" y="68" width="275" height="105" rx="10" fill="#0b111e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="518" y="93" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">PLANNING EFFICIENCY GAIN</text>
  <text x="518" y="132" font-family="sans-serif" font-size="34" font-weight="800" fill="#00f2fe" filter="url(#glow)">-20%</text>
  <text x="618" y="122" font-family="sans-serif" font-size="11" font-weight="600" fill="#10b981">Faster Route Time</text>
  <text x="618" y="138" font-family="sans-serif" font-size="10" fill="#64748b">Measured vs Manual</text>
  <path d="M 518 152 Q 580 135 640 148 T 755 138" fill="none" stroke="#00f2fe" stroke-width="2"/>

  <!-- Card 2: Campus Coverage -->
  <rect x="500" y="188" width="275" height="110" rx="10" fill="#0b111e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="518" y="213" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">COLLABORATIVE PROJECT</text>
  <text x="518" y="246" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">5-Member Team</text>
  <text x="518" y="266" font-family="sans-serif" font-size="11" fill="#38bdf8">Delta University Student Team</text>
  <text x="518" y="284" font-family="sans-serif" font-size="10" fill="#64748b">AI Model &amp; Logistics Algorithm Lead</text>

  <!-- Card 3: Tech Stack Badges -->
  <rect x="500" y="313" width="275" height="110" rx="10" fill="#0b111e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="518" y="336" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">INTEGRATED TECH STACK</text>
  <g transform="translate(518, 350)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="58" height="24" rx="5" fill="#1e293b"/>
    <text x="29" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">Python</text>
    <!-- Tag 2 -->
    <rect x="66" y="0" width="70" height="24" rx="5" fill="#1e293b"/>
    <text x="101" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#818cf8" text-anchor="middle">AI Routing</text>
    <!-- Tag 3 -->
    <rect x="144" y="0" width="95" height="24" rx="5" fill="#1e293b"/>
    <text x="191" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">Data Analytics</text>
    <!-- Tag 4 -->
    <rect x="0" y="30" width="85" height="24" rx="5" fill="#1e293b"/>
    <text x="42" y="46" font-family="sans-serif" font-size="10" font-weight="600" fill="#f472b6" text-anchor="middle">Optimization</text>
    <!-- Tag 5 -->
    <rect x="93" y="30" width="85" height="24" rx="5" fill="#1e293b"/>
    <text x="135" y="46" font-family="sans-serif" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle">Smart Transit</text>
  </g>
</svg>
